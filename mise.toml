[tools]
python = "3.14"
uv = "0.13.5"

[tasks.analyse]
description = "Run all measurement analyses; plots + text output go to analysis/output/"
run = """
uv sync -q
uv run python analysis/inspect_irs.py measurements/2026-11-18/*/*.wav > analysis/output/inspect_irs.txt
uv run python analysis/analyse_positions.py . analysis/output > analysis/output/positions.txt
uv run python analysis/analyse_corners.py . analysis/output > analysis/output/corners.txt
uv run python analysis/analyse_dj_sum.py . analysis/output > analysis/output/dj_sum.txt
uv run python analysis/analyse_closeups.py . analysis/output > analysis/output/closeups.txt
uv run python analysis/design_eq.py . analysis/output eq > analysis/output/eq_design.log
uv run python analysis/design_eq.py . analysis/output eq harman > analysis/output/eq_design_harman.log
uv run python analysis/analyse_treble.py . analysis/output > analysis/output/treble.txt
uv run python analysis/check_dsp_electrical.py . analysis/output > analysis/output/dsp_electrical.txt
uv run python analysis/check_dsp_electrical.py . analysis/output v2 > analysis/output/dsp_electrical_v2.txt
uv run python analysis/sub_positions_modes.py . analysis/output > analysis/output/sub_positions_modes.txt
uv run python analysis/analyse_eq_room.py . analysis/output > analysis/output/eq_room.txt
uv run python analysis/check_nosub.py . analysis/output > analysis/output/nosub.txt
uv run python analysis/build_explainer.py .
"""

[tasks.measure]
description = "Measure one set with REW (semi-automatic): mise run measure <set>; sets in docs/plans/next-session-eq-sub.json"
run = "uv run python tools/rew_measure.py"

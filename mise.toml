[tools]
python = "3.14"
uv = "0.13.5"

[tasks.analyse]
description = "Run all measurement analyses; plots + text output go to analysis/output/"
run = """
uv sync -q
uv run python analysis/inspect_irs.py measurements/2026-11-18/*/*.wav > analysis/output/inspect_irs.txt
uv run python analysis/analyse_positions.py . analysis/output > analysis/output/positions.txt
uv run python analysis/analyse_corners.py . analysis/output > analysis/output/corners.txt
uv run python analysis/analyse_dj_sum.py . analysis/output > analysis/output/dj_sum.txt
uv run python analysis/analyse_closeups.py measurements/2026-11-18/closeups analysis/output/closeups.png reference/mic-cal/MM-1C_0deg.txt > analysis/output/closeups.txt
uv run python analysis/design_eq.py . analysis/output eq > analysis/output/eq_design.log
uv run python analysis/design_eq.py . analysis/output eq harman > analysis/output/eq_design_harman.log
uv run python analysis/analyse_treble.py . analysis/output > analysis/output/treble.txt
uv run python analysis/check_dsp_electrical.py measurements/2026-11-18/dsp-electrical eq/v1-flat analysis/output/dsp_electrical.png > analysis/output/dsp_electrical.txt
uv run python analysis/check_dsp_electrical.py measurements/2026-11-22/dsp-electrical-v2 eq/v2-harman analysis/output/dsp_electrical_v2.png > analysis/output/dsp_electrical_v2.txt
uv run python tools/sweep_selftest.py docs/plans/sweep-check.json sweep-check-seat "measurements/2026-11-22/eq-seat/1 L seat eq2 Nov 22.wav" "measurements/2026-11-22/dsp-electrical-v2/1 L dsp electrical v2 Nov 22.wav" "measurements/2026-11-18/corners/2 R corner front left Nov 18.wav" "measurements/2026-11-18/closeups/1 L close up port Nov 18.wav" > analysis/output/sweep_selftest.txt
uv run python analysis/sub_positions_modes.py . analysis/output > analysis/output/sub_positions_modes.txt
uv run python analysis/analyse_eq_room.py . analysis/output > analysis/output/eq_room.txt
uv run python analysis/check_nosub.py . analysis/output > analysis/output/nosub.txt
uv run python analysis/analyse_sub_c.py . analysis/output > analysis/output/sub_c.txt
W=measurements/2026-11-22
uv run python analysis/check_sweep_vs_rew.py analysis/output/sweep_vs_rew_electrical_flat.png "$W/sweep-check-electrical-flat/1 L dsp rew.wav" "$W/sweep-check-electrical-flat/1 L dsp py.wav" 20 20000 0.1 "$W/sweep-check-electrical-flat/1 L dsp rew.wav" "$W/sweep-check-electrical-flat/1 L dsp py2.wav" 20 20000 0.1 "$W/sweep-check-electrical-flat/1 L dsp rew.wav" "$W/sweep-check-electrical-flat-pre2/1 L dsp py.wav" 20 20000 0.1 > analysis/output/sweep_vs_rew_electrical_flat.txt
uv run python analysis/check_sweep_vs_rew.py analysis/output/sweep_vs_rew_electrical.png "$W/dsp-electrical-v2/1 L dsp electrical v2 Nov 22.wav" "$W/sweep-check-electrical/1 L dsp py.wav" 20 20000 0.1 "$W/dsp-electrical-v2/1 L dsp electrical v2 Nov 22.wav" "$W/sweep-check-electrical/1 L dsp py2.wav" 20 20000 0.1 > analysis/output/sweep_vs_rew_electrical.txt
uv run python analysis/check_sweep_vs_rew.py --t0-info analysis/output/sweep_vs_rew_seat.png "$W/eq-seat/1 L seat eq2 Nov 22.wav" "$W/sweep-check-seat/1 L seat py.wav" 30 300 1.0 "$W/eq-seat/2 R seat eq2 Nov 22.wav" "$W/sweep-check-seat/2 R seat py.wav" 30 300 1.0 > analysis/output/sweep_vs_rew_seat.txt
uv run python analysis/check_sweep_vs_rew.py analysis/output/sweep_vs_rew_seat2.png "$W/sweep-check-seat2/1 L seat rew.wav" "$W/sweep-check-seat2/1 L seat py.wav" 25 20000 0.2 "$W/sweep-check-seat2/1 L seat rew.wav" "$W/sweep-check-seat2/1 L seat py2.wav" 25 20000 0.2 "$W/sweep-check-seat2/1 L seat py.wav" "$W/sweep-check-seat2/1 L seat py2.wav" 25 20000 0.2 > analysis/output/sweep_vs_rew_seat2.txt
uv run python tools/lf_check.py "$W/tone-check/P01 DSP Out1 to In3.txt" $W/sweep-check-electrical-flat $W/sweep-check-electrical-flat-pre2 > analysis/output/lf_check_electrical_flat.txt
uv run python analysis/build_explainer.py .
uv run python analysis/build_writeup.py . analysis/output
"""

[tasks.measure]
description = "Measure one set: mise run measure <plan.json> <set> [--date D] [--dry-run] (tools/sweep.py; plan format in measurements/README.md)"
run = "uv run python tools/sweep.py"

[tasks.rew-load]
description = "Load a set measured by sweep.py into REW and save <set>.mdat: mise run rew-load <set folder>"
run = "uv run python tools/rew_load.py"

[tasks.sweep-selftest]
description = "Offline check of sweep.py's processing on simulated recordings (no audio/DSP/REW)"
run = "uv sync -q && uv run python tools/sweep_selftest.py docs/plans/sweep-check.json sweep-check-seat \"measurements/2026-11-22/eq-seat/1 L seat eq2 Nov 22.wav\" \"measurements/2026-11-22/dsp-electrical-v2/1 L dsp electrical v2 Nov 22.wav\""
